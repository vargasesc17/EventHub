spring:
  datasource:
    url: ${NOTIFICACIONES_DB_URL:jdbc:postgresql://localhost:5432/notificaciones_db}
    username: ${NOTIFICACIONES_DB_USER}
    password: ${NOTIFICACIONES_DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 10                     # contrato: máximo 10 mensajes en memoria por consumidor
        default-requeue-rejected: false  # un mensaje rechazado va a la DLQ, no vuelve a la cola
  mail:
    host: ${MAIL_HOST:localhost}         # Mailpit en local (ver docker-compose)
    port: ${MAIL_PORT:1025}
  jpa:
    hibernate:
      ddl-auto: update
  application:
    name: notificaciones

notificaciones:
  correo:
    remitente: EventHub <no-responder@eventhub.test>

management:
  endpoints:
    web:
      base-path: /
  endpoint:
    health:
      show-details: always
