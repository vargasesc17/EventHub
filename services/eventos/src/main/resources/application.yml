spring:
  datasource:
    url: ${EVENTOS_DB_URL:jdbc:postgresql://localhost:5432/eventos_db}
    username: ${EVENTOS_DB_USER}
    password: ${EVENTOS_DB_PASSWORD}
  application:
    name: eventos
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      base-path: /
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
