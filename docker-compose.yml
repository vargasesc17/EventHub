# EventHub: todo el sistema con un solo comando
# Levantar:  docker compose up -d --build
# Apagar:    docker compose down        (agrega -v para borrar también los datos)
#
# Redes propias (no se usa la red por defecto de Docker). Cada contenedor solo ve lo que necesita:
#   eventhub_frontend    Nginx ↔ Eventos y Boletería (la aplicación web no ve la base ni el broker)
#   eventhub_mensajeria  los tres microservicios ↔ RabbitMQ
#   eventhub_datos       los tres microservicios ↔ PostgreSQL (cada uno con su usuario y su base, ADR-0002)
#   eventhub_correo      Notificaciones ↔ Mailpit
#
# Puertos publicados en el equipo (todos para desarrollo y demo; en producción solo quedaría el 8080):
#   8080 aplicación web · 8081/8082/8083 APIs y /health de cada servicio (Swagger en 8081 y 8082)
#   15672 panel de RabbitMQ · 5672 AMQP y 5432 PostgreSQL (para inspeccionar desde el equipo)
#   8025 bandeja de Mailpit · 1025 SMTP de Mailpit

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: eventhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"     # AMQP: aquí se conectan los microservicios
      - "15672:15672"   # Panel de administración: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # las colas durables sobreviven a un reinicio (ADR-0001)
    networks: [mensajeria]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    build: ./infra/postgres
    container_name: eventhub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # Usuarios y contraseñas de cada servicio; los usa el script de init
      EVENTOS_DB_USER: ${EVENTOS_DB_USER}
      EVENTOS_DB_PASSWORD: ${EVENTOS_DB_PASSWORD}
      BOLETERIA_DB_USER: ${BOLETERIA_DB_USER}
      BOLETERIA_DB_PASSWORD: ${BOLETERIA_DB_PASSWORD}
      NOTIFICACIONES_DB_USER: ${NOTIFICACIONES_DB_USER}
      NOTIFICACIONES_DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [datos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eventos:
    build: ./services/eventos
    container_name: eventhub-eventos
    networks: [frontend, mensajeria, datos]
    environment:
      EVENTOS_DB_USER: ${EVENTOS_DB_USER}
      EVENTOS_DB_PASSWORD: ${EVENTOS_DB_PASSWORD}
      EVENTOS_DB_URL: jdbc:postgresql://postgres:5432/eventos_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  boleteria:
    build: ./services/boleteria
    container_name: eventhub-boleteria
    networks: [frontend, mensajeria, datos]
    environment:
      BOLETERIA_DB_USER: ${BOLETERIA_DB_USER}
      BOLETERIA_DB_PASSWORD: ${BOLETERIA_DB_PASSWORD}
      BOLETERIA_DB_URL: jdbc:postgresql://postgres:5432/boleteria_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      BOLETERIA_QR_SECRETO: ${BOLETERIA_QR_SECRETO}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notificaciones:
    build: ./services/notificaciones
    container_name: eventhub-notificaciones
    networks: [mensajeria, datos, correo]
    environment:
      NOTIFICACIONES_DB_USER: ${NOTIFICACIONES_DB_USER}
      NOTIFICACIONES_DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD}
      NOTIFICACIONES_DB_URL: jdbc:postgresql://postgres:5432/notificaciones_db
      RABBITMQ_HOST: rabbitmq          # dentro de Docker el host es el nombre del servicio
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Servidor de correo falso: atrapa los correos de Notificaciones para verlos en el navegador
  # (http://localhost:8025). No envía nada de verdad (#25).
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: eventhub-mailpit
    networks: [correo]
    ports:
      - "8025:8025"   # página web para ver los correos
      - "1025:1025"   # SMTP: aquí envía Notificaciones
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: eventhub-frontend
    networks: [frontend]
    ports:
      - "8080:80"     # único punto de entrada de la aplicación (ADR-0005)
    depends_on:
      eventos:
        condition: service_healthy
      boleteria:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    name: eventhub_frontend
  mensajeria:
    name: eventhub_mensajeria
  datos:
    name: eventhub_datos
  correo:
    name: eventhub_correo

volumes:
  rabbitmq_data:
  postgres_data:
